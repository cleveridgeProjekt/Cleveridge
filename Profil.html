<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Mein Profil – Stammprodukte</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      max-width: 800px;
      margin: 0 auto 30px auto;
    }

    .produkt-img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      border: 2px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.2s ease;
      background-color: #f8f8f8;
      padding: 5px;
    }

    .produkt-img.aktiv {
      border-color: #2ecc71;
      background-color: #eaffea;
    }

    input, button {
      padding: 8px;
      margin: 5px;
    }

    ul {
      list-style-type: none;
      padding: 0;
    }

    li {
      margin: 8px 0;
    }
  </style>
</head>
<body>

<h1>👤 Mein Profil – Stammprodukte</h1>

<a href="einkaufsliste.html" style="position: absolute; top: 20px; right: 20px;">Zur Einkaufsliste 🛒</a>

<h2>🖱️ Klicke auf ein Produkt, um es als Stammprodukt zu speichern:</h2>

<div class="grid" id="produktGrid">
  <!-- Produktbilder werden per JavaScript eingefügt -->
</div>

<h3>➕ Manuell hinzufügen</h3>
<input type="text" id="produktInput" placeholder="Produktname">
<button onclick="hinzufuegen()">Hinzufügen</button>
<script>
  document.getElementById("produktInput").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      hinzufuegen();
    }
  });
</script>
<h3>📋 Deine Stammprodukte:</h3>
<ul id="liste">
  <!-- dynamisch -->
</ul>

<script>
  const alleProdukte = [
    { name: "banana", bild: "img/banana.png" },
    { name: "Käse", bild: "img/cheese.png" },
    { name: "Hänchen", bild: "img/chicken.png" },
    { name: "Gurke", bild: "img/cucumber.png" },
    { name: "Ei", bild: "img/egg.png" },
    { name: "Aubergine", bild: "img/eggplant.jpg" },
    { name: "Karotte", bild: "img/karotte.jpg" },
    { name: "Rindfleisch", bild: "img/meat.png" },
    { name: "Salat", bild: "img/lettuce.png" },
    { name: "Milch", bild: "img/milk.png" },
    { name: "Apfel", bild: "img/apfel.jpg" },
    { name: "Pizza", bild: "img/pizza.jpg" },
    { name: "Pilze", bild: "img/mushroom.jpg" },
    { name: "Wurst", bild: "img/sausage.png" },
    { name: "Tomate", bild: "img/tomato.jpg" }
  ];

  let stammprodukte = JSON.parse(localStorage.getItem("stammprodukte") || "[]");

  const grid = document.getElementById("produktGrid");
  const liste = document.getElementById("liste");

  function speichern() {
    localStorage.setItem("stammprodukte", JSON.stringify(stammprodukte));
    renderListe();
    renderBilder();
  }

  function toggleProdukt(name) {
    if (stammprodukte.includes(name)) {
      stammprodukte = stammprodukte.filter(p => p !== name);
    } else {
      stammprodukte.push(name);
    }
    speichern();
  }

  function renderBilder() {
    grid.innerHTML = "";
    alleProdukte.forEach(p => {
      const img = document.createElement("img");
      img.src = p.bild;
      img.alt = p.name;
      img.title = p.name;
      img.className = "produkt-img";
      if (stammprodukte.includes(p.name)) {
        img.classList.add("aktiv");
      }
      img.onclick = () => toggleProdukt(p.name);
      grid.appendChild(img);
    });
  }

  function renderListe() {
    liste.innerHTML = "";
    stammprodukte.forEach((produkt, index) => {
      const li = document.createElement("li");
      li.textContent = produkt + " ";
      const btn = document.createElement("button");
      btn.textContent = "🗑️";
      btn.onclick = () => {
        stammprodukte.splice(index, 1);
        speichern();
      };
      li.appendChild(btn);
      liste.appendChild(li);
    });
  }

  function hinzufuegen() {
    const input = document.getElementById("produktInput");
    const name = input.value.trim();
    if (name && !stammprodukte.includes(name)) {
      stammprodukte.push(name);
      speichern();
      input.value = "";
    }
  }

  // Initial anzeigen
  renderBilder();
  renderListe();
</script>

</body>
</html>
